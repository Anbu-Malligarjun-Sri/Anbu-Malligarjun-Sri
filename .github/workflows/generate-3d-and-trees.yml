name: Generate 3D Contrib + Treeify
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # optional daily run at 06:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 3D contribution artwork
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Verify generated files
        run: |
          ls -la profile-3d-contrib/ || echo "No profile-3d-contrib directory found"

      - name: Run post-processing (convert to trees with white background)
        run: |
          python3 svg_to_trees.py profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/profile-night-rainbow-trees.svg

      - name: Commit & push processed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-rainbow-trees.svg || true
          if git commit -m "chore: generate + postprocess 3d contrib -> trees" ; then
            git push
          else
            echo "No changes to commit"
          fi
